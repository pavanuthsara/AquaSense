name: Mobile CI

on:
  push:
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Analyze, test, and build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile_app/android/*.gradle*
            mobile_app/android/**/*.gradle*
            mobile_app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter project
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=AQUASENSE_ENV=production
          --dart-define=AQUASENSE_API_BASE_URL=https://api.example.com
          --dart-define=AQUASENSE_GOOGLE_SERVER_CLIENT_ID=ci-placeholder.apps.googleusercontent.com

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aquasense-android-debug
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
