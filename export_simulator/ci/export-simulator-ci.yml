name: Export Simulator CI

on:
  push:
    paths:
      - "export_simulator/**"
      - ".github/workflows/export-simulator-ci.yml"
  pull_request:
    paths:
      - "export_simulator/**"
      - ".github/workflows/export-simulator-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-simulator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test transit simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: export_simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: export_simulator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (incl. calibration drift check)
        run: python -m pytest -q

      - name: Example simulation
        run: python -m transit_sim advise --mass 0.3 --total 1000 --water 0.4 --gas 1.2 --hours 36 --temp-range 24 28
