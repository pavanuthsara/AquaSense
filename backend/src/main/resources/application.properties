spring.application.name=backend

spring.datasource.url=${AQUASENSE_DB_URL:jdbc:postgresql://localhost:5432/aquasense}
spring.datasource.username=${AQUASENSE_DB_USERNAME:aquasense}
spring.datasource.password=${AQUASENSE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

aquasense.auth.google-client-id=${AQUASENSE_GOOGLE_CLIENT_ID:}
aquasense.auth.jwt-secret=${AQUASENSE_JWT_SECRET:}
aquasense.auth.access-token-ttl=15m
aquasense.auth.refresh-token-ttl=30d
aquasense.auth.issuer=aquasense-api
aquasense.auth.audience=aquasense-mobile
